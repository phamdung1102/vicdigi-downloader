# yt-dlp config file for VICdigi Downloader v4.0
# Place this file in same folder as yt-dlp.exe

# Network Options
--concurrent-fragments 4
--buffer-size 16K
--retries 5
--fragment-retries 5
--socket-timeout 30

# User Agent
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Download Options
--no-check-certificates
--geo-bypass
--no-warnings
--ignore-errors

# Format Selection for YouTube - Support 4K and best quality
# Priority: 4K > 1440p > 1080p > 720p (with best audio)
--format "bestvideo[height<=2160][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=2160]+bestaudio/best[height<=2160]/bestvideo+bestaudio/best"
--merge-output-format mp4

# Output Options
# --restrict-filenames  # DISABLED to keep original titles
# --windows-filenames   # DISABLED to keep Unicode characters

# Subtitle Options
--write-subs
--write-auto-subs
--sub-langs "en,vi"
--sub-format "vtt/best"

# Metadata
--embed-metadata
--add-metadata

# Progress
--progress
--newline