# yt-dlp config file for 4K/High Quality Downloads
# Optimized for maximum quality and stability

# Network Options - Optimized for 4K
--concurrent-fragments 16
--buffer-size 64K
--http-chunk-size 10M
--retries 10
--fragment-retries 10
--socket-timeout 30
--no-part

# User Agent - Latest Chrome
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Download Options
--no-check-certificates
--geo-bypass
--no-warnings
--ignore-errors
--no-abort-on-error

# Format Selection for 4K/High Quality
# Priority order: 4K MP4 > 4K any format > Best available
# With VP9 codec support for YouTube 4K
--format "bestvideo[height<=2160][vcodec^=av01]+bestaudio[acodec^=opus]/bestvideo[height<=2160][vcodec^=vp9]+bestaudio[acodec^=opus]/bestvideo[height<=2160][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=2160]+bestaudio/best[height<=2160]/bestvideo+bestaudio/best"

# Prefer MP4 container
--merge-output-format mp4

# Use ffmpeg for better conversion
--prefer-ffmpeg

# Output Options - Keep original titles
# --restrict-filenames  # DISABLED
# --windows-filenames   # DISABLED

# Subtitle Options
--write-subs
--write-auto-subs
--sub-langs "en,vi,ja,ko,zh"
--sub-format "vtt/best"
--embed-subs

# Metadata
--embed-metadata
--add-metadata
--embed-thumbnail
--embed-chapters

# Progress
--progress
--newline

# Cache
--cache-dir "temp"

# Rate limiting for stability (optional - remove if you want max speed)
# --limit-rate 50M

# Cookies (if needed for private videos)
# --cookies "cookies.txt"
