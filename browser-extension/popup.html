<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Andrew Downloader</title>
</head>
<body>
  <main>
    <div class="brand">
      <img src="icon48.png" alt="" />
      <h1>Andrew Downloader</h1>
    </div>
    <p>Gửi trang video hiện tại sang ứng dụng.</p>
    <button id="downloadBtn">Tải ngay</button>
    <button class="secondary" id="sendBtn">Mở trong ứng dụng</button>
    <label class="toggle-row">
      <input id="videoButtonEnabled" type="checkbox" />
      <span>Hiện nút tải trên video</span>
    </label>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
