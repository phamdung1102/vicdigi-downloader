appId: com.vicdigi.downloader
productName: Andrew Downloader
copyright: Copyright © 2024-2026 Andrew Phạm

directories:
  output: dist

# ── Auto-update qua GitHub Releases ──────────────────────────
# Repo public CHỈ chứa file cài đặt (source code không đưa lên GitHub).
# electron-builder ghi thông tin này vào app-update.yml trong app;
# electron-updater check bản mới tại:
#   https://github.com/phamdung1102/vicdigi-downloader/releases
# releaseType: release -> `npm run release` đăng bản mới lên luôn,
# không cần vào GitHub bấm publish draft.
publish:
  provider: github
  owner: phamdung1102
  repo: vicdigi-downloader
  releaseType: release

# Files đưa vào app.asar
files:
  - main.js
  - preload.js
  - index-v6.html
  - subtitle-converter.js
  - download-manager.js
  - package.json
  - config/license-public.pem
  - config/telemetry.json
  - src/**/*
  - node_modules/**/*
  - assets/**/*
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"
  - "!node_modules/**/test*"
  - "!node_modules/**/tests*"
  - "!node_modules/**/*.ts"
  - "!*.py"
  - "!*.ps1"
  - "!*.bat"
  - "!*.conf"
  - "!.local/**"

# yt-dlp.exe & ffmpeg.exe ngoài asar -> resources/
extraResources:
  - from: "yt-dlp.exe"
    to: "yt-dlp.exe"
  - from: "ffmpeg.exe"
    to: "ffmpeg.exe"
  - from: "yt-dlp.conf"
    to: "yt-dlp.conf"
  - from: "yt-dlp-4k.conf"
    to: "yt-dlp-4k.conf"

asar: true
asarUnpack:
  - "**/*.node"

compression: normal
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowElevation: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Andrew Downloader
  license: LICENSE.md
  deleteAppDataOnUninstall: false
  menuCategory: true
  artifactName: "${productName}-v${version}-Setup.exe"

portable:
  artifactName: "${productName}-v${version}-Portable.exe"
